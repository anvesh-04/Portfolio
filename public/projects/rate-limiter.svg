<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Requests flow through a token bucket and are throttled against a rate limit">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1424"/>
      <stop offset="60%" stop-color="#130f1f"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <radialGradient id="rglow" cx="62%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#a476ff" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#a476ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="rbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5e4491"/>
      <stop offset="100%" stop-color="#a476ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#rbg)"/>
  <rect width="1200" height="420" fill="url(#rgrid)"/>
  <rect width="1200" height="420" fill="url(#rglow)"/>

  <!-- incoming request burst -->
  <g fill="#f3f3f3" fill-opacity=".3">
    <circle cx="70" cy="210" r="9"/><circle cx="112" cy="180" r="9"/><circle cx="112" cy="240" r="9"/>
    <circle cx="154" cy="150" r="9"/><circle cx="154" cy="210" r="9"/><circle cx="154" cy="270" r="9"/>
    <circle cx="196" cy="180" r="9"/><circle cx="196" cy="240" r="9"/><circle cx="196" cy="120" r="9"/>
    <circle cx="238" cy="210" r="9"/><circle cx="238" cy="150" r="9"/><circle cx="238" cy="270" r="9"/>
  </g>
  <path d="M275 210 h55" stroke="#f3f3f3" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>

  <!-- token bucket -->
  <g>
    <path d="M350 110 h170 l-21 200 h-128 z" fill="none" stroke="#a476ff" stroke-width="4" stroke-opacity=".85"/>
    <path d="M372 218 h126 l-13 92 h-100 z" fill="#a476ff" fill-opacity=".2"/>
    <g fill="#a9ff5b" fill-opacity=".85">
      <circle cx="404" cy="250" r="11"/><circle cx="438" cy="278" r="11"/>
      <circle cx="472" cy="250" r="11"/><circle cx="438" cy="224" r="11"/>
    </g>
  </g>

  <!-- gate: allowed through, or dropped -->
  <path d="M545 210 h55" stroke="#a9ff5b" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
  <path d="M545 210 q36 0 48 62" stroke="#ff6b6b" stroke-opacity=".45" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="9 11"/>

  <!-- throughput against the limit -->
  <g>
    <path d="M630 118 h480" stroke="#ff6b6b" stroke-opacity=".5" stroke-width="3" stroke-dasharray="12 10"/>
    <rect x="640" y="240" width="46" height="100" rx="8" fill="url(#rbar)"/>
    <rect x="706" y="196" width="46" height="144" rx="8" fill="url(#rbar)"/>
    <rect x="772" y="148" width="46" height="192" rx="8" fill="url(#rbar)"/>
    <rect x="838" y="212" width="46" height="128" rx="8" fill="url(#rbar)"/>
    <rect x="904" y="164" width="46" height="176" rx="8" fill="url(#rbar)"/>
    <rect x="970" y="118" width="46" height="222" rx="8" fill="#a476ff" fill-opacity=".35"/>
    <rect x="1036" y="262" width="46" height="78" rx="8" fill="#5e4491" fill-opacity=".6"/>
    <path d="M630 340 h480" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>
  </g>
</svg>
